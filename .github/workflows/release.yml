name: Release

# Al publicar un tag v* : compila los binarios nativos (macOS + Windows) y crea
# la release con ellos. Lanzable también a mano desde la pestaña Actions.
#
# También es REUSABLE (workflow_call): auto-release.yml lo invoca pasándole el tag que acaba de
# crear. Se hace así y no dejando que el push del tag lo dispare porque **un push hecho con el
# GITHUB_TOKEN no dispara workflows** (protección anti-bucle de GitHub): encadenarlos dejaría tags
# publicados sin instalables.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: "Tag a construir y publicar (p.ej. v0.4.0)"
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            dist: dist:mac
            artifact: macos
            files: |
              dist/*.dmg
              dist/*.zip
          - os: windows-latest
            dist: dist:win
            artifact: windows
            # latest.yml = metadata que electron-updater necesita para detectar la versión nueva
            # (lo genera electron-builder por tener `build.publish` en package.json). Sin él, el
            # auto-update de Windows no ve ninguna release. `latest-mac.yml` NO se publica a
            # propósito: en macOS el update in-place es imposible con firma ad-hoc — src/updater.js.
            files: |
              dist/*.exe
              dist/*.exe.blockmap
              dist/latest.yml
    runs-on: ${{ matrix.os }}
    env:
      # Tag efectivo: el que nos pasa auto-release.yml, o el del push del tag.
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Invocados desde auto-release.yml el ref es `main`, así que hay que pedir el tag
          # explícitamente o construiríamos un commit distinto del que se publica.
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # El binario reporta app.getVersion() = version de package.json EN EL BUILD. Si el tag
      # apunta a un commit sin bumpear (o se hizo a mano), saldría 0.1.0. Estampamos aquí la
      # versión del propio tag (vX.Y.Z → X.Y.Z) para que SIEMPRE coincida, pase lo que pase.
      - name: Stamp version from tag
        if: startsWith(env.TAG, 'v')
        shell: bash
        run: npm version "${TAG#v}" --no-git-tag-version --allow-same-version

      - name: Build ${{ matrix.artifact }}
        # --publish never: electron-builder NO publica (al ver el tag lo intentaría
        # y pediría GH_TOKEN); de la release se encarga el job `release` con softprops.
        run: npm run ${{ matrix.dist }} -- --publish never
        env:
          # Firma ad-hoc (mac.identity "-" en package.json): evita el "app dañada"
          # en Apple Silicon sin certificado. Desactivamos el auto-descubrimiento
          # para que no intente coger una identidad real del llavero del runner.
          # Para firma+notarización real, añade los secrets CSC_LINK/CSC_KEY_PASSWORD
          # y APPLE_ID/APPLE_APP_SPECIFIC_PASSWORD/APPLE_TEAM_ID y quita esta línea.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # El CI en verde NO prueba que el auto-update funcione: electron-updater descarga el asset
      # cuyo nombre pone `path:` en latest.yml, y si no existe da 404 y el update falla en
      # silencio. Pasó con el artifactName por defecto de NSIS ("Monstro Setup 0.5.0.exe"):
      # electron-builder escribe los espacios como guiones en el yml y GitHub los sube como
      # puntos, así que los tres nombres eran distintos. Con `nsis.artifactName` sin espacios
      # coinciden; este guard es para enterarnos aquí y no en la máquina del usuario.
      - name: Comprobar que latest.yml apunta al .exe real
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          node -e "
          const fs = require('fs');
          const p = (fs.readFileSync('dist/latest.yml', 'utf8').match(/^path: (.+)$/m) || [])[1];
          if (!p) throw new Error('latest.yml sin campo path');
          if (!fs.existsSync('dist/' + p.trim())) {
            throw new Error('latest.yml apunta a ' + p.trim() + ', que no existe. En dist/: ' + fs.readdirSync('dist').join(', '));
          }
          console.log('latest.yml -> ' + p.trim() + ' OK');
          "

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          # tag_name explícito: invocados desde auto-release.yml el ref es `main` y softprops
          # publicaría la release contra la rama en vez de contra el tag.
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Monstro ${{ inputs.tag || github.ref_name }}
          files: artifacts/**/*
          fail_on_unmatched_files: true
          generate_release_notes: true
